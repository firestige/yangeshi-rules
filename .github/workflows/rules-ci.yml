name: Rules CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rules-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: rules-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python3 -m pip install -r ci/requirements.txt
      - run: python3 ci/validate.py
      - run: node wiki/test.mjs
